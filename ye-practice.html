<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>也 · 副词练习</title>
<style>
  :root{
    --bg:#FFF0E6; --card:#FFFFFF; --ink:#3A3530; --muted:#9C948A;
    --primary:#FF6B4A; --primary-d:#E04F30; --blue:#5BA3D6; --green:#4ECB71;
    --yellow:#FFD05C; --line:#F0E2D0;
    --radius:20px; --shadow:0 8px 24px rgba(180,130,100,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100%; overflow-x:hidden;
  }
  .wrap{width:100%; max-width:760px; padding:18px 16px 40px; position:relative;}
  .screen{display:none;}
  .screen.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  h1{font-size:30px; font-weight:800; text-align:center; margin:8px 0 2px;}
  .sub{text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; letter-spacing:.5px;}
  .bigchar{font-size:54px; font-weight:800; color:var(--primary); text-align:center; margin:4px 0 2px;}

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px; margin-bottom:18px;
  }
  .btn{
    border:none; border-radius:16px; font-size:20px; font-weight:700;
    padding:16px 22px; cursor:pointer; transition:transform .12s, box-shadow .12s;
    background:var(--primary); color:#fff; box-shadow:0 5px 0 var(--primary-d);
  }
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--primary-d);}
  .btn.blue{background:var(--blue); box-shadow:0 5px 0 #3E82AD;}
  .btn.green{background:var(--green); box-shadow:0 5px 0 #38A85A;}
  .btn.ghost{background:#F3ECE0; color:var(--ink); box-shadow:0 5px 0 #DFD3BF;}
  .btn.big{font-size:24px; padding:20px; width:100%;}
  .btn.sm{font-size:16px; padding:12px 16px; box-shadow:0 4px 0 var(--primary-d);}
  .btn:disabled{opacity:.5; box-shadow:none; cursor:default;}

  .gear{
    position:fixed; top:16px; right:16px; width:46px; height:46px; border-radius:50%;
    background:var(--card); box-shadow:var(--shadow); border:none; cursor:pointer;
    font-size:24px; z-index:30; display:flex; align-items:center; justify-content:center;
  }
  .panel{
    position:fixed; inset:0; background:rgba(60,50,40,.35); z-index:40;
    display:none; align-items:flex-end; justify-content:center;
  }
  .panel.show{display:flex;}
  .panel .box{
    background:var(--card); width:100%; max-width:760px; border-radius:24px 24px 0 0;
    padding:24px 22px calc(24px + env(safe-area-inset-bottom)); box-shadow:var(--shadow);
  }
  .panel h3{margin:0 0 16px; font-size:20px;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row label{font-size:16px; font-weight:600;}
  .row input[type=range]{width:160px;}
  .switch{position:relative; width:54px; height:30px; background:#D9CFBE; border-radius:30px; cursor:pointer; transition:background .2s;}
  .switch.on{background:var(--green);}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; background:#fff; border-radius:50%; transition:left .2s;}
  .switch.on::after{left:27px;}
  .seg{display:flex; gap:8px;}
  .seg button{border:none; background:#F3ECE0; border-radius:12px; padding:8px 14px; font-size:15px; font-weight:700; cursor:pointer; color:var(--muted);}
  .seg button.sel{background:var(--primary); color:#fff;}

  .center{text-align:center;}
  .hint{text-align:center; color:var(--muted); font-size:14px; margin:8px 0;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px;}
  .progress{font-size:15px; font-weight:700; color:var(--muted);}

  /* 练习图区 */
  .pics{display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; margin:6px 0 4px;}
  .piccol{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .imgbox{width:200px; height:200px; border-radius:18px; background:#fff; box-shadow:var(--shadow);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    transition:opacity .45s ease, transform .45s ease;}
  .imgbox img{width:100%; height:100%; object-fit:contain;}
  .imgbox.pending{opacity:.18; transform:scale(.92);}
  .piccol .tag{font-size:15px; font-weight:700; color:var(--muted);}
  .piccol .cap{font-size:17px; font-weight:700; min-height:24px; text-align:center;}
  .arrow{font-size:34px; color:var(--primary); align-self:center; font-weight:800;}

  .answer-hint{text-align:center; font-size:20px; font-weight:800; color:var(--primary); min-height:28px; margin:12px 0 6px;}
  .answer-text{text-align:center; font-size:20px; font-weight:800; color:var(--green); min-height:26px; margin:2px 0 4px;}
  .controls{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .controls .btn{flex:1; min-width:140px; max-width:220px;}

  .done-emoji{font-size:64px; text-align:center;}
  .done-score{text-align:center; font-size:22px; font-weight:800; margin:10px 0 4px;}
  .done-sub{text-align:center; color:var(--muted); margin-bottom:6px;}
</style>
</head>
<body>

<button class="gear" id="gearBtn" title="设置">&#9881;</button>

<!-- 设置面板 -->
<div class="panel" id="settingsPanel">
  <div class="box">
    <h3>设置</h3>
    <div class="row">
      <label>旁白（自动朗读）</label>
      <div class="switch on" id="setNarrate"></div>
    </div>
    <div class="row">
      <label>显示文字</label>
      <div class="switch on" id="setText"></div>
    </div>
    <div class="row">
      <label>语音语速</label>
      <input type="range" id="setRate" min="0.6" max="1.2" step="0.05" value="0.9">
    </div>
    <div class="row">
      <label>音量</label>
      <input type="range" id="setVol" min="0" max="1" step="0.05" value="0.9">
    </div>
    <div class="row">
      <label>出题方式</label>
      <div style="font-size:15px; color:var(--muted); font-weight:700;">每次随机 10 道</div>
    </div>
    <button class="btn big" id="closeSet" style="margin-top:18px;">完成</button>
  </div>
</div>

<div class="wrap">

  <!-- 首页 -->
  <div class="screen active" id="home">
    <h1>也 · 副词练习</h1>
    <div class="sub">先听前半句，再看后半句，用「也」造一句</div>
    <div class="card">
      <div class="bigchar">也</div>
      <div class="center" style="font-size:17px; line-height:1.8;">
        「也」表示<b>同样</b>的情况。<br>
        先听前半句，再看后半句，<br>
        轮到你时，用<b>「也」</b>说一句吧！<br>
        例如：爸爸在吃苹果，<b>弟弟也在吃苹果</b>。
      </div>
      <div class="hint">点「开始练习」，先听前半句，再想后半句～</div>
      <button class="btn big" id="startBtn">开始练习</button>
    </div>
    <p class="center" style="color:var(--muted); font-size:13px;">需要声音，请打开设备音量 &#128266;</p>
  </div>

  <!-- 练习页 -->
  <div class="screen" id="practice">
    <div class="topbar">
      <button class="btn ghost" id="exitBtn" style="padding:10px 14px; font-size:15px; box-shadow:0 3px 0 #DFD3BF;">&#8592; 返回</button>
      <div class="progress" id="prog">第 1 / 17 题</div>
      <div style="width:64px;"></div>
    </div>
    <div class="card">
      <div class="pics">
        <div class="piccol">
          <div class="imgbox" id="preBox"><img id="preImg" alt=""></div>
          <div class="cap" id="preText"></div>
        </div>
        <div class="piccol" id="postWrap">
          <div class="imgbox pending" id="postBox"><img id="postImg" alt=""></div>
          <div class="cap" id="postText"></div>
        </div>
      </div>
      <div class="answer-hint" id="answerHint"></div>
      <div class="answer-text" id="answerText"></div>
      <div class="controls">
        <button class="btn blue sm" id="rehearBtn">&#128266; 再听前半句</button>
        <button class="btn ghost sm" id="showAnsBtn">&#128161; 听答案</button>
        <button class="btn green" id="nextBtn" style="font-size:20px;">下一题 &#8594;</button>
      </div>
    </div>
  </div>

  <!-- 结束页 -->
  <div class="screen" id="done">
    <div class="card">
      <div class="done-emoji">&#127881;</div>
      <div class="done-score" id="doneScore">你完成啦！</div>
      <div class="done-sub" id="doneSub">用「也」说句子，越来越棒了！</div>
      <button class="btn big green" id="againBtn">再玩一次</button>
      <button class="btn ghost big" id="homeBtn" style="margin-top:12px; font-size:18px;">回到首页</button>
    </div>
  </div>

</div>

<script>
/* ---------- 题目数据 ---------- */
// 每句：a=前半句图片, b=后半句图片, pre=前半句文本, post=后半句文本(答案)
const SENTENCES = [
  {a:"a01", b:"b01", pre:"爸爸在吃苹果",      post:"弟弟也在吃苹果"},
  {a:"a02", b:"b02", pre:"妹妹有牛奶",        post:"弟弟也有牛奶"},
  {a:"a03", b:"b03", pre:"爸爸喜欢草莓",      post:"妈妈也喜欢草莓"},
  {a:"a04", b:"b04", pre:"弟弟要喝水",        post:"妹妹也要喝水"},
  {a:"a05", b:"b05", pre:"妹妹在搭积木",      post:"弟弟也在搭积木"},
  {a:"a06", b:"b06", pre:"妹妹有贴纸",        post:"弟弟也有贴纸"},
  {a:"a07", b:"b07", pre:"弟弟在玩滑梯",      post:"妹妹也玩滑梯"},
  {a:"a08", b:"b08", pre:"弟弟想荡秋千",      post:"妹妹也想荡秋千"},
  {a:"a09", b:"b09", pre:"妈妈有长头发",      post:"妹妹也有长头发"},
  {a:"a10", b:"b10", pre:"爸爸戴眼镜",        post:"弟弟也戴眼镜"},
  {a:"a11", b:"b11", pre:"妹妹在睡觉",        post:"妈妈也在睡觉"},
  {a:"a12", b:"b12", pre:"弟弟举手了",        post:"妹妹也举手了"},
  {a:"a13", b:"b13", pre:"妹妹坐好了",        post:"弟弟也坐好了"},
  {a:"a14", b:"b14", pre:"妹妹笑了",          post:"爸爸也笑了"},
  {a:"a15", b:"b15", pre:"妈妈有点难过",      post:"弟弟也有点难过"},
  {a:"a16", b:"b16", pre:"弟弟怕打雷",        post:"妹妹也怕打雷"},
  {a:"a17", b:"b17", pre:"爸爸觉得好热",      post:"妈妈也觉得好热"}
];

/* ---------- 设置 ---------- */
const settings = { narrate:true, showText:true, rate:0.9, vol:0.9 };

/* ---------- 状态 ---------- */
let qOrder = [];
let qi = 0;
let timers = [];
let doneCount = 0;

/* ---------- 工具 ---------- */
const $ = s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=settings.rate; u.volume=settings.vol;
    const vs=window.speechSynthesis.getVoices();
    const zh=vs.find(v=>/zh|Chinese|中文/i.test(v.lang+v.name));
    if(zh) u.voice=zh;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 屏幕切换 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
  window.scrollTo(0,0);
}

/* ---------- 开始 ---------- */
function startGame(){
  qOrder = shuffle(SENTENCES).slice(0,10);
  qi = 0;
  show('practice');
  loadQuestion();
}

/* ---------- 出题 ---------- */
function loadQuestion(){
  clearTimers();
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  const s = qOrder[qi];
  $('#prog').textContent = `第 ${qi+1} / ${qOrder.length} 题`;

  // 前半句
  $('#preImg').src = `ye-images/${s.a}.webp`;
  $('#preText').textContent = settings.showText ? s.pre : '';
  // 后半句（初始隐藏，等待加载）
  $('#postImg').src = `ye-images/${s.b}.webp`;
  $('#postBox').classList.add('pending');
  $('#postText').textContent = '';
  $('#postText').style.visibility = 'hidden';
  $('#answerHint').textContent = '';
  $('#answerText').textContent = '';

  // 停顿加载图片后，朗读前半句
  timers.push(setTimeout(()=>{
    if(settings.narrate) speak(s.pre);
  }, 1200));

  // 再停顿，呈现后半句图 + 引导语（仅显示，不朗读）
  timers.push(setTimeout(()=>{
    $('#postBox').classList.remove('pending');
    $('#answerHint').textContent = '轮到你啦，用「也」说一句吧！';
  }, 2600));
}

/* ---------- 按钮 ---------- */
$('#rehearBtn').addEventListener('click', ()=>{
  const s = qOrder[qi];
  if(settings.narrate) speak(s.pre);
});
$('#showAnsBtn').addEventListener('click', ()=>{
  const s = qOrder[qi];
  $('#postText').textContent = s.post;
  $('#postText').style.visibility = 'visible';
  $('#answerText').textContent = s.post;
  if(settings.narrate) speak(s.post);
});
$('#nextBtn').addEventListener('click', ()=>{
  // 进入下一题前，若还没看答案，给个提示但不强制
  qi++;
  if(qi >= qOrder.length){ finish(); }
  else { loadQuestion(); }
});

/* ---------- 结束 ---------- */
function finish(){
  clearTimers();
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  show('done');
  $('#doneScore').textContent = `你完成了 ${qOrder.length} 句练习！`;
}

/* ---------- 事件 ---------- */
$('#startBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', startGame);
$('#homeBtn').addEventListener('click', ()=>show('home'));
$('#exitBtn').addEventListener('click', ()=>{
  clearTimers();
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  show('home');
});

// 设置面板
$('#gearBtn').addEventListener('click', ()=>$('#settingsPanel').classList.add('show'));
$('#closeSet').addEventListener('click', ()=>{
  settings.vol = parseFloat($('#setVol').value);
  settings.rate = parseFloat($('#setRate').value);
  $('#settingsPanel').classList.remove('show');
});
$('#setVol').addEventListener('input', e=>settings.vol=parseFloat(e.target.value));
$('#setRate').addEventListener('input', e=>settings.rate=parseFloat(e.target.value));
function bindSwitch(id,key){
  const el=$('#'+id);
  el.addEventListener('click',()=>{ settings[key]=!settings[key]; el.classList.toggle('on',settings[key]); });
}
bindSwitch('setNarrate','narrate');
bindSwitch('setText','showText');

// 预载语音列表
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
