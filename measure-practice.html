<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量词练习</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#eaf4ff,#fdeef6); color:#2c3e50; min-height:100vh; }
header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; }
header h1 { font-size:18px; margin:0; color:#3a5a8a; }
#gear { border:none; background:#fff; width:42px; height:42px; border-radius:50%; font-size:20px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.1); }
main { display:flex; flex-direction:column; align-items:center; padding:8px 16px 28px; }
.screen { width:100%; display:flex; flex-direction:column; align-items:center; }
h2 { font-size:22px; color:#3a5a8a; margin:18px 0 6px; }
.sub { color:#7a8aa0; font-size:14px; margin:0 0 18px; text-align:center; }
.qbtns { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.qbtn { border:none; cursor:pointer; background:#fff; color:#2bb3a3; font-size:20px; font-weight:800;
  padding:18px 34px; border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,.1); transition:transform .08s; }
.qbtn:active { transform:scale(.96); }
.qbtn.alt { color:#e08a3c; }
.qbtn.wide { width:100%; font-size:18px; padding:14px; }
.home-link { margin-top:26px; color:#7a8aa0; font-size:14px; text-decoration:none; }
#prog { font-size:13px; color:#7a8aa0; margin:6px 0 12px; }
.card { width:min(86vw,420px); background:#fff; border-radius:24px; padding:18px; box-shadow:0 8px 24px rgba(60,90,140,.15); text-align:center; }
#pic { width:100%; aspect-ratio:1/1; object-fit:contain; background:#fff; border-radius:16px; cursor:pointer; }
#phrase { margin-top:14px; font-size:30px; font-weight:800; color:#2c3e50; min-height:38px; letter-spacing:2px; }
.row { display:flex; gap:14px; justify-content:center; margin-top:22px; }
.btn { border:none; cursor:pointer; border-radius:50px; font-size:17px; font-weight:700; padding:14px 22px; box-shadow:0 4px 12px rgba(0,0,0,.12); transition:transform .08s; }
.btn:active { transform:scale(.95); }
.btn:disabled { opacity:.4; cursor:default; transform:none; box-shadow:none; }
.btn.ghost { background:#eef1f6; color:#2c3e50; }
#speak { background:#2bb3a3; color:#fff; display:flex; align-items:center; gap:8px; }
#next { background:#ffd166; color:#5a4a00; }
.linkbtn { margin-top:18px; border:none; background:none; color:#7a8aa0; font-size:15px; cursor:pointer; text-decoration:underline; display:none; }
/* mode cards */
.mode-wrap { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.mode-card { background:#fff; border-radius:20px; padding:22px 18px; width:min(82vw,300px); box-shadow:0 6px 18px rgba(60,90,140,.12); text-align:center; }
.m-emoji { font-size:42px; }
.m-title { font-size:20px; font-weight:800; color:#3a5a8a; margin:6px 0; }
.m-desc { font-size:14px; color:#7a8aa0; margin-bottom:16px; line-height:1.5; }
/* measure grid */
.mgrid { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:580px; }
.mbtn { border:none; cursor:pointer; background:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 4px 12px rgba(0,0,0,.1); display:flex; flex-direction:column; align-items:center; gap:4px; min-width:88px; transition:transform .08s; }
.mbtn:active { transform:scale(.95); }
.mbtn .mm { font-size:28px; font-weight:800; color:#2bb3a3; }
.mbtn .mc { font-size:12px; color:#7a8aa0; }
#mask { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; }
#mask.on { display:block; }
#panel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(90vw,340px); background:#fff; border-radius:20px; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
#panel h3 { margin:0 0 16px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
#closeX { border:none; background:#f0f2f6; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; }
.field { margin:16px 0; }
.field label { display:block; font-size:14px; margin-bottom:6px; color:#5a6b80; }
.field input[type=range] { width:100%; }
.switch { display:flex; align-items:center; justify-content:space-between; }
.switch button { border:none; background:#2bb3a3; color:#fff; width:54px; height:30px; border-radius:16px; cursor:pointer; font-size:13px; }
.switch button.off { background:#cfd6e0; }
#closeP { margin-top:8px; width:100%; border:none; background:#eef1f6; color:#2c3e50; padding:12px; border-radius:12px; font-size:15px; cursor:pointer; }
</style></head>
<body>
<header><h1>量词练习</h1><button id="gear" title="设置">⚙</button></header>
<main>
  <!-- ① 首页：选择练习方式 -->
  <div id="start" class="screen">
    <h2>量词练习</h2>
    <p class="sub">选择练习方式</p>
    <div class="mode-wrap">
      <div class="mode-card">
        <div class="m-emoji">🎲</div>
        <div class="m-title">看图听词</div>
        <div class="m-desc">随机抽取卡片练习，可选 10 / 20 道</div>
        <div class="qbtns">
          <button class="qbtn" data-n="10">10 道</button>
          <button class="qbtn alt" data-n="20">20 道</button>
        </div>
      </div>
      <div class="mode-card">
        <div class="m-emoji">📚</div>
        <div class="m-title">量词浏览</div>
        <div class="m-desc">选一个量词，依次翻看它的全部卡片</div>
        <button class="qbtn wide" id="goBrowse">进入 →</button>
      </div>
    </div>
    <a class="home-link" href="index.html">🏠 返回首页</a>
  </div>

  <!-- ② 量词选择 -->
  <div id="mselect" class="screen" style="display:none">
    <h2>选择量词</h2>
    <p class="sub" id="mcount"></p>
    <div id="mGrid" class="mgrid"></div>
    <button class="btn ghost" id="mBack" style="margin-top:22px">⬅ 返回</button>
  </div>

  <!-- ③ 浏览 -->
  <div id="play" class="screen" style="display:none">
    <div id="prog"></div>
    <div class="card">
      <img id="pic" src="" alt="">
      <div id="phrase"></div>
    </div>
    <div class="row">
      <button class="btn" id="prev">⬅ 上一张</button>
      <button class="btn" id="speak">🔊 听一听</button>
      <button class="btn" id="next">下一张 ➡</button>
    </div>
    <button class="linkbtn" id="swapMeasure">↩ 换一个量词</button>
  </div>

  <!-- ④ 完成 -->
  <div id="done" class="screen" style="display:none">
    <h2 id="doneTitle">🎉 完成！</h2>
    <p class="sub" id="doneSub"></p>
    <div class="qbtns" id="doneBtns"></div>
  </div>
</main>
<div id="mask"><div id="panel">
  <h3>设置 <button id="closeX">✕</button></h3>
  <div class="field"><label>音量 <span id="volV"></span></label><input id="vol" type="range" min="0" max="1" step="0.05"></div>
  <div class="field"><label>语速 <span id="rateV"></span></label><input id="rate" type="range" min="0.5" max="1.5" step="0.05"></div>
  <div class="field switch"><span>显示文字</span><button id="setText">开</button></div>
  <button id="closeP">关闭</button>
</div></div>

function showStart(){ ['play','mselect','done'].forEach(id=>$('#'+id).style.display='none'); $('#start').style.display='flex'; }
function showMSelect(){ ['play','start','done'].forEach(id=>$('#'+id).style.display='none'); $('#mselect').style.display='flex'; }
function showPlay(){ ['start','done','mselect'].forEach(id=>$('#'+id).style.display='none'); $('#play').style.display='flex'; }
function showDone(){
  ['play','start','mselect'].forEach(id=>$('#'+id).style.display='none'); $('#done').style.display='flex';
  $('#doneBtns').innerHTML='';
  if(mode==='measure'){
    $('#doneTitle').textContent='📚 量词「'+curMeasure+'」浏览完成';
    $('#doneSub').textContent='共 '+round.length+' 张卡片，做得真棒！';
    const b1=document.createElement('button'); b1.className='qbtn'; b1.textContent='换一个量词';
    b1.addEventListener('click', showMSelect);
    const b2=document.createElement('button'); b2.className='qbtn alt'; b2.textContent='返回首页';
    b2.addEventListener('click', ()=>location.href='index.html');
    $('#doneBtns').append(b1,b2);
  } else {
    $('#doneTitle').textContent='🎉 本轮练习完成！';
    $('#doneSub').textContent='你完成了 '+round.length+' 道量词练习，继续加油！';
    const b1=document.createElement('button'); b1.className='qbtn'; b1.textContent='再来一轮';
    b1.addEventListener('click', ()=>startRound(round.length));
    const b2=document.createElement('button'); b2.className='qbtn alt'; b2.textContent='返回首页';
    b2.addEventListener('click', ()=>location.href='index.html');
    $('#doneBtns').append(b1,b2);
  }
}
function render(){
  const it=cur();
  $('#pic').src='data:image/webp;base64,'+it.img;
  $('#phrase').textContent=settings.showText?it.phrase:'';
  if(mode==='measure'){ $('#prog').textContent='量词【'+curMeasure+'】 · 第 '+(qi+1)+' / '+round.length+' 张'; }
  else { $('#prog').textContent='第 '+(qi+1)+' / '+round.length+' 张'; }
  $('#prev').disabled = (qi===0);
  $('#swapMeasure').style.display = (mode==='measure') ? 'inline-block' : 'none';
}
function speak(){ try{ speechSynthesis.cancel(); }catch(e){} const u=new SpeechSynthesisUtterance(cur().phrase); u.lang='zh-CN'; u.rate=settings.rate; u.volume=settings.volume; speechSynthesis.speak(u); }
function next(){ qi++; if(qi>=round.length){ showDone(); } else { render(); } }
function prev(){ if(qi>0){ qi--; render(); } }
function startRound(n){ mode='random'; curMeasure=''; round = shuffle(DATA.slice()).slice(0,n); qi=0; showPlay(); render(); }
function startMeasure(m){ mode='measure'; curMeasure=m; round = MEASURES[m].slice(); qi=0; showPlay(); render(); }
function buildMeasureGrid(){
  const grid=$('#mGrid'); grid.innerHTML='';
  Object.keys(MEASURES).sort().forEach(m=>{
    const b=document.createElement('button');
    b.className='mbtn';
    b.innerHTML='<span class="mm">'+m+'</span><span class="mc">'+MEASURES[m].length+' 张</span>';
    b.addEventListener('click', ()=>startMeasure(m));
    grid.appendChild(b);
  });
  $('#mcount').textContent='共 '+Object.keys(MEASURES).length+' 个量词，点一个开始';
}
$('#speak').addEventListener('click', speak);
$('#pic').addEventListener('click', speak);
$('#next').addEventListener('click', next);
$('#prev').addEventListener('click', prev);
$('#swapMeasure').addEventListener('click', showMSelect);
document.querySelectorAll('.qbtn[data-n]').forEach(b=> b.addEventListener('click', ()=> startRound(+b.dataset.n)));
$('#goBrowse').addEventListener('click', showMSelect);
$('#mBack').addEventListener('click', showStart);
function openPanel(){ $('#mask').classList.add('on'); }
function closePanel(){ $('#mask').classList.remove('on'); }
$('#gear').addEventListener('click', openPanel);
$('#closeX').addEventListener('click', closePanel);
$('#closeP').addEventListener('click', closePanel);
$('#mask').addEventListener('click', e=>{ if(e.target===$('#mask')) closePanel(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });
$('#vol').value=settings.volume; $('#rate').value=settings.rate;
$('#volV').textContent=settings.volume; $('#rateV').textContent=settings.rate;
$('#vol').addEventListener('input', e=>{ settings.volume=+e.target.value; $('#volV').textContent=settings.volume; });
$('#rate').addEventListener('input', e=>{ settings.rate=+e.target.value; $('#rateV').textContent=settings.rate; });
function syncText(){ const b=$('#setText'); b.textContent=settings.showText?'开':'关'; b.classList.toggle('off',!settings.showText); if(cur()) $('#phrase').textContent=settings.showText?cur().phrase:''; }
$('#setText').addEventListener('click', ()=>{ settings.showText=!settings.showText; syncText(); });
buildMeasureGrid();
showStart();
</script>
</body></html>
