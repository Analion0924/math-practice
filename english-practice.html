<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语单词练习 · 沪教版一二年级</title>
<style>
  :root{
    --blue:#4f9dde; --yellow:#ffd166; --green:#5fc28a; --red:#ef6f6f;
    --purple:#a78bfa; --bg:#f4f8fc; --card:#ffffff; --ink:#33415c; --soft:#8aa0bd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);}
  header{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;
    padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.12);}
  header h1{font-size:18px;margin:0;flex:1;}
  header button{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:10px;
    padding:7px 12px;font-size:14px;cursor:pointer;}
  header button:hover{background:rgba(255,255,255,.35);}
  .page{display:none;max-width:920px;margin:0 auto;padding:16px;}
  .page.active{display:block;}
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .topbar .back{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .panel{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 3px 12px rgba(60,90,140,.10);margin-bottom:14px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  select,input[type=text]{font-size:14px;padding:8px 10px;border:2px solid #e3ecf5;border-radius:10px;background:#fff;color:var(--ink);max-width:260px;}
  input[type=text]{flex:1;min-width:140px;}
  .count{font-weight:700;color:var(--blue);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .sec-h{font-size:15px;font-weight:700;margin:18px 2px 8px;color:var(--purple);line-height:1.4;}
  .sec-h small{color:var(--soft);font-weight:400;}
  .sec-h .g{color:var(--blue);}
  .wcard{position:relative;background:var(--card);border:2px solid #e3ecf5;border-radius:14px;
    padding:12px 8px;text-align:center;cursor:pointer;transition:.15s;user-select:none;}
  .wcard .wen{font-size:18px;font-weight:700;color:var(--ink);word-break:break-word;}
  .wcard .wzh{font-size:13px;color:var(--soft);margin-top:2px;}
  .wcard .wipa{font-size:11px;color:#b6c4d8;margin-top:1px;}
  .wcard .star{position:absolute;top:4px;right:7px;color:var(--yellow);font-size:13px;}
  .wcard.on{background:#eaf5ff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,157,222,.25);}
  .wcard.on .wen{color:var(--blue);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:12px 16px;
    font-size:15px;cursor:pointer;flex:1;min-width:120px;font-weight:600;}
  .btn.alt{background:var(--green);}
  .btn.ghost{background:#eef3f9;color:var(--ink);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .prog{font-size:14px;color:var(--soft);margin-bottom:6px;}
  .prompt{font-size:16px;font-weight:700;margin:4px 0 10px;}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .opt{background:var(--card);border:3px solid #e3ecf5;border-radius:16px;padding:18px 10px;
    text-align:center;cursor:pointer;transition:.12s;font-family:inherit;}
  .opt .oen{font-size:22px;font-weight:800;color:var(--ink);display:block;word-break:break-word;}
  .opt .ozh{font-size:14px;color:var(--soft);margin-top:4px;display:block;}
  .opt:hover{border-color:var(--blue);}
  .opt.correct{border-color:var(--green);background:#e9faf0;}
  .opt.wrong{border-color:var(--red);background:#fdeaea;opacity:.7;}
  .opt:disabled{cursor:default;}
  .feedback{height:24px;font-weight:700;margin:12px 0;font-size:16px;}
  .feedback.ok{color:var(--green);} .feedback.bad{color:var(--red);}
  .speak{background:var(--yellow);color:#5a4a00;border:none;border-radius:14px;padding:14px 22px;
    font-size:18px;cursor:pointer;font-weight:700;}
  .center{text-align:center;}
  .rword{background:var(--card);border-radius:20px;padding:30px 16px;margin:14px 0;text-align:center;
    box-shadow:0 3px 12px rgba(60,90,140,.10);}
  .rword .rzh{font-size:20px;color:var(--soft);margin-bottom:6px;}
  .rword .ren{font-size:40px;font-weight:800;color:var(--blue);}
  .rword .ren2{font-size:46px;font-weight:800;color:var(--ink);}
  .settings{background:#eef3f9;border-radius:14px;padding:12px;margin:10px 0;display:none;}
  .settings.show{display:block;}
  .settings label{display:inline-flex;align-items:center;gap:5px;margin:4px 10px 4px 0;font-size:14px;cursor:pointer;}
  .settings .row{margin:8px 0;font-size:14px;}
  .gear{background:var(--purple);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;}
  .navrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .navrow .btn{flex:1;min-width:90px;}
  .done{text-align:center;padding:30px 10px;}
  .done h2{font-size:24px;color:var(--green);}
  .hint{color:var(--soft);font-size:13px;margin:2px 0 10px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <h1>英语单词练习 · 沪教版一二年级</h1>
  <button onclick="show('home')">首页</button>
</header>

<!-- 首页 / 选词 -->
<section id="home" class="page active">
  <div class="panel">
    <div class="filters">
      <select id="fGrade"></select>
      <select id="fUnit"></select>
      <input type="text" id="fSearch" placeholder="搜索英文或中文…">
      <button class="btn ghost" style="flex:0;min-width:auto" onclick="selectAllFiltered()">全选当前</button>
      <button class="btn ghost" style="flex:0;min-width:auto" onclick="clearAll()">清空</button>
    </div>
    <div class="hint">先按<b>年级 → 单元</b>勾选本次要练习的单词（可任意数量），再选择下面的练习模式。点击卡片即选中（蓝色高亮）。切换单元/搜索后，顶部「全选当前」可一键选入当前显示的单词。</div>
    <div>已选 <span class="count" id="selCount">0</span> 个</div>
  </div>
  <div id="homeGrid"></div>
  <div class="actions" style="position:sticky;bottom:0;background:var(--bg);padding:12px 0;">
    <button class="btn" id="startListen" onclick="startListen()">🎧 听指认</button>
    <button class="btn alt" id="startRepeat" onclick="startRepeat()">🗣 跟读</button>
  </div>
</section>

<!-- 听指认 -->
<section id="listen" class="page">
  <div class="topbar"><button class="back" onclick="show('home')">← 返回选词</button>
    <button class="gear" onclick="toggleSet('lSet')">⚙ 设置</button></div>
  <div class="panel">
    <div class="settings" id="lSet">
      <div class="row">选项数量：
        <label><input type="radio" name="optNum" value="2">二选一</label>
        <label><input type="radio" name="optNum" value="3" checked>三选一</label>
        <label><input type="radio" name="optNum" value="4">四选一</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="lShowZh" checked>选项显示中文</label>
        <label><input type="checkbox" id="lAuto" checked>进入自动播放语音</label>
      </div>
      <div class="row">语速：<input type="range" id="lRate" min="0.5" max="1.2" step="0.05" value="0.85">
        <span id="lRateV">0.85</span></div>
    </div>
    <div class="prog" id="lProg"></div>
    <div class="prompt" id="lPrompt">听一听，选出你听到的词</div>
    <div class="center"><button class="speak" id="lSpeak" onclick="replayListen()">🔊 播放</button></div>
    <div class="opts" id="lOpts" style="margin-top:14px;"></div>
    <div class="feedback" id="lFeedback"></div>
    <div class="navrow">
      <button class="btn ghost" id="lPrev" onclick="prevListen()">⬅ 上一题</button>
      <button class="btn" id="lNext" onclick="nextListen()">下一题 ➡</button>
      <button class="btn ghost" onclick="show('home')">🏠 返回首页</button>
    </div>
  </div>
</section>

<!-- 跟读 -->
<section id="repeat" class="page">
  <div class="topbar"><button class="back" onclick="show('home')">← 返回选词</button>
    <button class="gear" onclick="toggleSet('rSet')">⚙ 设置</button></div>
  <div class="panel">
    <div class="settings" id="rSet">
      <div class="row">第二轮显示：
        <label><input type="radio" name="rLang" value="en" checked>英文</label>
        <label><input type="radio" name="rLang" value="zh">中文</label>
      </div>
      <div class="row"><label><input type="checkbox" id="rReplay" checked>第二轮自动重听英文</label></div>
      <div class="row">语速：<input type="range" id="rRate" min="0.5" max="1.2" step="0.05" value="0.85">
        <span id="rRateV">0.85</span></div>
    </div>
    <div class="prog" id="rProg"></div>
    <div class="prompt" id="rHint"></div>
    <div class="rword" id="rWord"></div>
    <div class="center"><button class="speak" id="rSpeak" onclick="replayRepeat()">🔊 听英文</button></div>
    <div class="navrow">
      <button class="btn ghost" id="rPrev" onclick="prevRepeat()">⬅ 上一题</button>
      <button class="btn" id="rNext" onclick="nextRepeat()">下一个 ➡</button>
      <button class="btn ghost" onclick="show('home')">🏠 返回首页</button>
    </div>
  </div>
</section>

<!-- 完成 -->
<section id="done" class="page">
  <div class="done">
    <h2>🎉 练习完成！</h2>
    <p id="doneMsg"></p>
    <div class="actions">
      <button class="btn" onclick="restartMode()">再来一轮</button>
      <button class="btn alt" onclick="show('home')">返回选词</button>
    </div>
  </div>
</section>

{"code": "M4U1", "name": "Activities", "words": [{"en": "play football", "ipa": "pleɪ ˈfʊtbɔːl", "pos": "phr", "zh": "踢足球", "core": false, "id": 201}, {"en": "play basketball", "ipa": "pleɪ ˈbɑːskɪtbɔːl", "pos": "phr", "zh": "打篮球", "core": false, "id": 202}, {"en": "play ping-pong", "ipa": "pleɪ ˈpɪŋpɒŋ", "pos": "phr", "zh": "打乒乓", "core": false, "id": 203}, {"en": "play cards", "ipa": "pleɪ kɑːdz", "pos": "phr", "zh": "打牌", "core": false, "id": 204}]}, {"code": "M4U2", "name": "Mother's Day", "words": [{"en": "letter", "ipa": "ˈletə", "pos": "n", "zh": "信", "core": true, "id": 205}, {"en": "balloon", "ipa": "bəˈluːn", "pos": "n", "zh": "气球", "core": true, "id": 206}, {"en": "carnation", "ipa": "kɑːˈneɪʃn", "pos": "n", "zh": "康乃馨", "core": false, "id": 207}]}, {"code": "M4U3", "name": "Story time", "words": [{"en": "hungry", "ipa": "ˈhʌŋɡri", "pos": "adj", "zh": "饿的", "core": true, "id": 208}, {"en": "thirsty", "ipa": "ˈθɜːsti", "pos": "adj", "zh": "渴的", "core": true, "id": 209}, {"en": "bread", "ipa": "bred", "pos": "n", "zh": "面包", "core": true, "id": 210}, {"en": "milk", "ipa": "mɪlk", "pos": "n", "zh": "牛奶", "core": true, "id": 211}]}]}]}];
const WORDS = [];
const MAP = {};
BOOKS.forEach(b => b.modules.forEach(m => m.units.forEach(u => u.words.forEach(w => { WORDS.push(w); MAP[w.id] = w; }))));

let selected = new Set();
let filterGrade = 'all', filterUnit = 'all', searchTxt = '';
let lastMode = 'listen';

const settings = {
  listen: { optNum: 3, showZh: true, autoPlay: true, rate: 0.85 },
  repeat: { readLang: 'en', replay: true, rate: 0.85 }
};

/* ---------- TTS ---------- */
function pickVoice(lang){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(x => x.lang && x.lang.toLowerCase().startsWith(lang.toLowerCase())) || null;
}
function speak(text, lang, rate){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate || 1; u.pitch = 1;
    const v = pickVoice(lang); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = function(){}; }

/* ---------- 音效 ---------- */
let AC = null;
function ensureAudio(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; } }
  if(AC.state === 'suspended') AC.resume();
}
function tone(freq, start, dur, type, gain){
  if(!AC) return;
  const t = AC.currentTime + start;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function playCorrect(){ ensureAudio(); if(!AC) return; tone(660,0,0.12,'sine',0.25); tone(990,0.12,0.16,'sine',0.22); }
function playWrong(){ ensureAudio(); if(!AC) return; tone(220,0,0.16,'square',0.16); tone(160,0.14,0.22,'square',0.16); }
function playDone(){ ensureAudio(); if(!AC) return; tone(523,0,0.12,'sine',0.22); tone(659,0.12,0.12,'sine',0.22); tone(784,0.24,0.22,'sine',0.22); }

/* ---------- 工具 ---------- */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function $(s){ return document.querySelector(s); }
function show(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  $('#'+p).classList.add('active');
  window.scrollTo(0,0);
}

/* ---------- 选词页（年级 -> Module -> Unit） ---------- */
function buildFilters(){
  const g = $('#fGrade');
  g.innerHTML = '<option value="all">全部年级</option>' + BOOKS.map(b=>`<option value="${b.code}">${b.grade}（${b.code}）</option>`).join('');
  g.onchange = ()=>{ filterGrade = g.value; buildUnitFilter(); renderHome(); };
  $('#fSearch').oninput = (e)=>{ searchTxt = e.target.value.trim().toLowerCase(); renderHome(); };
  buildUnitFilter();
  renderHome();
}
function buildUnitFilter(){
  const t = $('#fUnit');
  let us = [];
  BOOKS.forEach(b=>{ if(filterGrade==='all'||b.code===filterGrade) b.modules.forEach(m=>m.units.forEach(u=>{
    const key = b.code + '/' + u.code;
    if(!us.find(x=>x.key===key)) us.push({key, label:u.code + ' ' + u.name});
  }));});
  t.innerHTML = '<option value="all">全部单元</option>' + us.map(x=>`<option value="${x.key}">${x.label}</option>`).join('');
  t.onchange = ()=>{ filterUnit = t.value; renderHome(); };
}
function visibleUnits(){
  const out = [];
  BOOKS.forEach(b=>{
    if(filterGrade!=='all' && b.code!==filterGrade) return;
    b.modules.forEach(m=>{
      m.units.forEach(u=>{
        const key = b.code + '/' + u.code;
        if(filterUnit!=='all' && filterUnit!==key) return;
        const words = u.words.filter(w=> !searchTxt || w.en.toLowerCase().includes(searchTxt) || w.zh.includes(searchTxt));
        if(words.length>0) out.push({b, m, u, words});
      });
    });
  });
  return out;
}
function renderHome(){
  const vu = visibleUnits();
  let html = '';
  vu.forEach(({b, m, u, words})=>{
    html += `<div class="sec-h"><span class="g">${b.grade} ${b.code}</span> · Module ${m.code.slice(1)} ${m.name} · Unit ${u.code.slice(3)} ${u.name} <small>${words.length} 词</small></div>`;
    html += '<div class="grid">';
    words.forEach(w=>{
      html += `<div class="wcard ${selected.has(w.id)?'on':''}" data-id="${w.id}">
        <div class="wen">${w.en}</div><div class="wzh">${w.zh}</div><div class="wipa">${w.ipa}</div>
        ${w.core?'<div class="star">★</div>':''}</div>`;
    });
    html += '</div>';
  });
  if(html==='') html = '<p class="hint">没有匹配的单词，试试调整筛选条件。</p>';
  $('#homeGrid').innerHTML = html;
  $('#homeGrid').querySelectorAll('.wcard').forEach(c=>{
    c.onclick = ()=>{ const id=+c.dataset.id; if(selected.has(id)) selected.delete(id); else selected.add(id); c.classList.toggle('on'); updateCount(); };
  });
  updateCount();
}
function updateCount(){ $('#selCount').textContent = selected.size;
  $('#startListen').disabled = selected.size<1; $('#startRepeat').disabled = selected.size<1; }
function selectAllFiltered(){
  visibleUnits().forEach(({words})=>words.forEach(w=>selected.add(w.id)));
  renderHome();
}
function clearAll(){ selected.clear(); renderHome(); }

/* ---------- 听指认 ---------- */
let roundL = [], qi = 0, curTarget = null;
function startListen(){ if(selected.size<1) return; lastMode='listen';
  roundL = shuffle([...selected]); qi = 0; show('listen'); renderListen(true); }
function renderListen(auto){
  curTarget = MAP[roundL[qi]];
  const n = Math.min(settings.listen.optNum, selected.size);
  const pool = shuffle([...selected].filter(id=>id!==curTarget.id));
  const distract = pool.slice(0, n - 1);
  const opts = shuffle([curTarget.id, ...distract]);
  $('#lProg').textContent = '第 ' + (qi+1) + ' / ' + roundL.length + ' 题';
  $('#lPrompt').textContent = selected.size < settings.listen.optNum ? '听一听，选出你听到的词（已自动调整为 '+n+' 选一）' : '听一听，选出你听到的词';
  let html = '';
  opts.forEach(id=>{ const w = MAP[id];
    html += `<button class="opt" data-id="${id}"><span class="oen">${w.en}</span>${settings.listen.showZh?`<span class="ozh">${w.zh}</span>`:''}</button>`;
  });
  $('#lOpts').innerHTML = html;
  $('#lOpts').querySelectorAll('.opt').forEach(b=>{ b.onclick = ()=>chooseListen(+b.dataset.id, b); });
  $('#lFeedback').textContent = ''; $('#lFeedback').className = 'feedback';
  $('#lPrev').disabled = (qi===0);
  $('#lNext').disabled = true;
  $('#lSpeak').onclick = ()=>speak(curTarget.en, 'en-US', settings.listen.rate);
  if(auto && settings.listen.autoPlay) speak(curTarget.en, 'en-US', settings.listen.rate);
}
function chooseListen(id, btn){
  if(id === curTarget.id){
    playCorrect(); btn.classList.add('correct');
    $('#lOpts').querySelectorAll('.opt').forEach(b=>b.disabled = true);
    $('#lFeedback').textContent = '✓ 太棒了！'; $('#lFeedback').className = 'feedback ok';
    $('#lNext').disabled = false;
  } else {
    playWrong(); btn.classList.add('wrong'); btn.disabled = true;
    $('#lFeedback').textContent = '✗ 再试试'; $('#lFeedback').className = 'feedback bad';
  }
}
function replayListen(){ if(curTarget) speak(curTarget.en, 'en-US', settings.listen.rate); }
function prevListen(){ if(qi>0){ qi--; renderListen(false); } }
function nextListen(){ qi++; if(qi>=roundL.length) showDone('听指认'); else renderListen(true); }

/* ---------- 跟读（两轮整体） ---------- */
let roundR = [], ri = 0, phase = 'r1';
function startRepeat(){ if(selected.size<1) return; lastMode='repeat';
  roundR = shuffle([...selected]); ri = 0; phase = 'r1'; show('repeat'); renderRepeat(); }
function renderRepeat(){
  const w = MAP[roundR[ri]];
  $('#rProg').textContent = (phase==='r1'?'第一轮':'第二轮') + ' · 第 ' + (ri+1) + ' / ' + roundR.length;
  if(phase==='r1'){
    $('#rHint').textContent = '第一轮：听一听，跟着读（显示中文 + 英文）';
    $('#rWord').innerHTML = `<div class="rzh">${w.zh}</div><div class="ren">${w.en}</div>`;
    speak(w.en, 'en-US', settings.repeat.rate);
  } else {
    $('#rHint').textContent = '第二轮：现在你来读（显示' + (settings.repeat.readLang==='en'?'英文':'中文') + '）' + (settings.repeat.replay?'，可再听一次':'');
    const txt = settings.repeat.readLang==='en' ? w.en : w.zh;
    $('#rWord').innerHTML = `<div class="ren2">${txt}</div>`;
    if(settings.repeat.replay) speak(w.en, 'en-US', settings.repeat.rate);
  }
  $('#rPrev').disabled = (phase==='r1' && ri===0);
}
function replayRepeat(){ const w = MAP[roundR[ri]]; if(w) speak(w.en, 'en-US', settings.repeat.rate); }
function nextRepeat(){
  if(phase==='r1'){
    if(ri < roundR.length-1){ ri++; renderRepeat(); }
    else { phase='r2'; ri=0; renderRepeat(); }
  } else {
    if(ri < roundR.length-1){ ri++; renderRepeat(); }
    else { showDone('跟读'); }
  }
}
function prevRepeat(){
  if(phase==='r2'){
    if(ri>0){ ri--; renderRepeat(); }
    else { phase='r1'; ri=roundR.length-1; renderRepeat(); }
  } else {
    if(ri>0){ ri--; renderRepeat(); }
  }
}

/* ---------- 完成 ---------- */
function showDone(label){ playDone(); $('#doneMsg').textContent = label + '练习完成，共 ' + (lastMode==='listen'?roundL.length:roundR.length) + ' 个词。'; show('done'); }
function restartMode(){ if(lastMode==='listen') startListen(); else startRepeat(); }

/* ---------- 设置绑定 ---------- */
function toggleSet(id){ $('#'+id).classList.toggle('show'); }
function initSettings(){
  document.querySelectorAll('input[name=optNum]').forEach(r=> r.onchange = ()=>{ if(r.checked) settings.listen.optNum = +r.value; });
  $('#lShowZh').onchange = e=> settings.listen.showZh = e.target.checked;
  $('#lAuto').onchange = e=> settings.listen.autoPlay = e.target.checked;
  $('#lRate').oninput = e=>{ settings.listen.rate = +e.target.value; $('#lRateV').textContent = e.target.value; };
  document.querySelectorAll('input[name=rLang]').forEach(r=> r.onchange = ()=>{ if(r.checked) settings.repeat.readLang = r.value; });
  $('#rReplay').onchange = e=> settings.repeat.replay = e.target.checked;
  $('#rRate').oninput = e=>{ settings.repeat.rate = +e.target.value; $('#rRateV').textContent = e.target.value; };
}

/* ---------- 初始化 ---------- */
buildFilters();
initSettings();
updateCount();
</script>
